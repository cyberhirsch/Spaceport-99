name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

# Pages deployment needs to mint an OIDC token and write the site.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish deploying rather than cancelling it mid-publish.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Builds the bundle for the /<repo>/ path Pages serves it from.
          GITHUB_PAGES: 'true'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    # Only the default branch publishes; every other branch just gets checked.
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # `enablement` turns Pages on for the repo if it is not already, so there
      # is no manual settings step before the first deploy.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - id: deploy
        uses: actions/deploy-pages@v4
